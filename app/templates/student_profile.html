<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduNote — Student Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
:root{--primary:#7c3aed;--bg:#f1f5f9;--white:#fff;--text:#1e293b;--light:#64748b;--border:#e2e8f0;--shadow:0 8px 30px rgba(0,0,0,.08);--radius:16px;}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px;}
.profile-wrap{width:100%;max-width:860px;display:grid;grid-template-columns:300px 1fr;gap:24px;}
.profile-card{background:var(--white);border-radius:20px;padding:32px 24px;box-shadow:var(--shadow);text-align:center;height:fit-content;}
.p-avatar{width:90px;height:90px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;color:#fff;font-size:36px;font-weight:700;}
.profile-card h2{font-size:20px;font-weight:700;margin-bottom:4px;}
.role-badge{display:inline-block;padding:5px 16px;background:#f3e8ff;color:#7c3aed;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:14px;}
.p-detail{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;color:#334155;}
.p-detail:last-child{border-bottom:none;}
.p-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.pstat{background:#f8fafc;border-radius:12px;padding:12px;text-align:center;}
.pstat h3{font-size:22px;font-weight:700;color:var(--primary);}
.pstat p{font-size:11px;color:var(--light);}
.form-card{background:var(--white);border-radius:20px;padding:28px;box-shadow:var(--shadow);}
.form-card h3{font-size:18px;font-weight:700;margin-bottom:6px;}
.form-card .subtitle{font-size:13px;color:var(--light);margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.fg{display:flex;flex-direction:column;gap:7px;}
.fg label{font-size:12px;font-weight:600;color:#334155;}
.fg input{border:1px solid var(--border);border-radius:11px;padding:12px 14px;font-size:13px;outline:none;transition:.3s;}
.fg input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,.08);}
.fg input[disabled]{background:#f8fafc;cursor:not-allowed;color:var(--light);}
.save-btn{padding:12px 30px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;transition:.25s;}
.save-btn:hover{background:#6d28d9;}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:var(--light);text-decoration:none;font-size:13px;}
.back-link:hover{color:var(--primary);}
.ok-msg{display:none;margin-top:12px;padding:11px 16px;background:#dcfce7;color:#166534;border-radius:10px;font-size:13px;font-weight:500;}
@media(max-width:750px){.profile-wrap{grid-template-columns:1fr;}.row{grid-template-columns:1fr;}}
</style>
<link rel="stylesheet" href="/static/student-theme.css">
</head>
<body>
<div class="profile-wrap">
  <div class="profile-card">
    <div class="p-avatar">{{ user.full_name[0] | upper }}</div>
    <h2>{{ user.full_name }}</h2>
    <span class="role-badge">🎓 Student</span>
    <div class="p-detail"><span>📧</span><span>{{ user.email }}</span></div>
    <div class="p-detail"><span>👤</span><span>@{{ user.username }}</span></div>
    <div class="p-detail"><span>🗓</span><span>Member since 2025</span></div>
    <div class="p-stats">
      <div class="pstat"><h3 id="pp-read">—</h3><p>Read</p></div>
      <div class="pstat"><h3 id="pp-comments">—</h3><p>Comments</p></div>
      <div class="pstat"><h3 id="pp-streak">—</h3><p>Streak</p></div>
      <div class="pstat"><h3 id="pp-progress">—</h3><p>Progress</p></div>
    </div>
    <a href="/student/{{ user.id }}" class="back-link">← Back to Dashboard</a>
  </div>

  <div class="form-card">
    <h3>✏️ Edit Profile</h3>
    <p class="subtitle">Update your personal information below.</p>
    <form id="profileForm">
      <div class="row">
        <div class="fg"><label>Full Name</label><input type="text" id="f-name" value="{{ user.full_name }}"></div>
        <div class="fg"><label>Username</label><input type="text" id="f-username" value="{{ user.username }}"></div>
      </div>
      <div class="row">
        <div class="fg"><label>Email (read-only)</label><input type="email" value="{{ user.email }}" disabled></div>
        <div class="fg"><label>Role</label><input type="text" value="Student" disabled></div>
      </div>
      <div class="row">
        <div class="fg"><label>New Password</label><input type="password" id="f-pw" placeholder="Leave blank to keep current"></div>
        <div class="fg"><label>Confirm Password</label><input type="password" id="f-cpw" placeholder="Re-enter new password"></div>
      </div>
      <button type="submit" class="save-btn">💾 Save Changes</button>
      <div class="ok-msg" id="okMsg">✅ Profile updated successfully!</div>
    </form>
  </div>
</div>

<script>
const SID = Number("{{ user.id }}") || 0;
async function loadStats() {
  const r = await fetch(`/student/${SID}/stats`);
  const d = await r.json();
  document.getElementById("pp-read").innerText     = d.books_read  ?? 0;
  document.getElementById("pp-comments").innerText = d.total_comments ?? 0;
  document.getElementById("pp-streak").innerText   = d.streak ?? 0;
  document.getElementById("pp-progress").innerText = (d.progress ?? 0) + "%";
}
document.getElementById("profileForm").addEventListener("submit", e => {
  e.preventDefault();
  const pw = document.getElementById("f-pw").value;
  const cp = document.getElementById("f-cpw").value;
  if (pw && pw !== cp) { alert("Passwords do not match."); return; }
  document.getElementById("okMsg").style.display = "block";
  setTimeout(() => { document.getElementById("okMsg").style.display = "none"; }, 4000);
});
loadStats();
</script>
</body>
</html>
