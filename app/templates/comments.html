<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduNote — Comments</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
:root{--primary:#2563eb;--sidebar:#0f172a;--bg:#f1f5f9;--white:#fff;--text:#1e293b;--light:#64748b;--border:#e2e8f0;--shadow:0 8px 30px rgba(0,0,0,.08);--radius:16px;}
body{background:var(--bg);color:var(--text);}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;z-index:100;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:12px;padding:28px 24px 22px;border-bottom:1px solid #1e293b;}
.brand-icon{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:flex;align-items:center;justify-content:center;font-size:22px;}
.brand h2{font-size:20px;font-weight:700;} .brand p{font-size:12px;color:#94a3b8;margin-top:2px;}
.nav-label{font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:1.2px;padding:20px 24px 8px;}
.menu{list-style:none;padding:0 12px;}
.menu li a{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-size:14px;font-weight:500;transition:.25s;margin-bottom:2px;}
.menu li a:hover{background:#1e293b;color:#fff;} .menu li.active a{background:#2563eb;color:#fff;}
.sidebar-footer{margin-top:auto;padding:20px 24px;border-top:1px solid #1e293b;}
.sidebar-footer a{display:flex;align-items:center;gap:10px;color:#94a3b8;text-decoration:none;font-size:14px;padding:10px 12px;border-radius:10px;transition:.25s;}
.sidebar-footer a:hover{background:#1e293b;color:#fff;}
.main-content{margin-left:260px;min-height:100vh;}
.topbar{background:var(--white);padding:16px 32px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.06);border-bottom:1px solid var(--border);}
.topbar h2{font-size:20px;font-weight:600;} .topbar a{color:var(--light);text-decoration:none;font-size:14px;}
.page{padding:28px 32px;}

/* SEARCH + FILTER BAR */
.toolbar{display:flex;gap:14px;align-items:center;margin-bottom:24px;flex-wrap:wrap;}
.toolbar input{
  flex:1;min-width:240px;padding:12px 16px;border:1px solid var(--border);
  border-radius:12px;font-size:14px;outline:none;transition:.3s;
}
.toolbar input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.08);}
.toolbar select{
  padding:12px 16px;border:1px solid var(--border);border-radius:12px;
  font-size:14px;outline:none;background:#fff;cursor:pointer;
}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:28px;}
.stat-card{background:var(--white);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);text-align:center;border:1px solid var(--border);}
.stat-card h2{font-size:30px;font-weight:700;color:var(--primary);margin-bottom:6px;}
.stat-card p{color:var(--light);font-size:13px;}

/* COMMENT LIST */
.comment-list{display:flex;flex-direction:column;gap:16px;}
.comment-card{
  background:var(--white);border-radius:var(--radius);padding:22px;
  box-shadow:var(--shadow);border:1px solid var(--border);
  display:flex;gap:16px;align-items:flex-start;transition:.3s;
}
.comment-card:hover{transform:translateY(-2px);}
.c-avatar{
  width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,#2563eb,#60a5fa);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;font-weight:700;
}
.c-body h4{font-size:15px;font-weight:600;margin-bottom:4px;}
.c-body .c-meta{font-size:12px;color:var(--light);margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap;}
.c-body .c-text{font-size:14px;line-height:1.65;color:#334155;}
.c-book-tag{
  display:inline-block;padding:4px 12px;background:#eef4ff;
  color:var(--primary);border-radius:20px;font-size:11px;font-weight:600;
}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;color:var(--light);}
.empty-state .ei{font-size:56px;margin-bottom:14px;}
.empty-state h3{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px;}

@media(max-width:900px){
  .mobile-menu-btn{display:inline-flex;}
  .sidebar{
    position:fixed;
    left:-290px;
    top:0;
    bottom:0;
    width:280px;
    height:100vh;
    height:100dvh;
    z-index:1000;
    transition:left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow:4px 0 25px rgba(0,0,0,0.3);
  }
  .sidebar.open{left:0;}
  .main-content{margin-left:0 !important;width:100%;max-width:100vw;}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:12px;}
  .page{padding:16px 14px;}
  .topbar{padding:10px 16px;}
  .toolbar{flex-direction:column;}
  .toolbar input, .toolbar select{width:100%;}
}
@media(max-width:600px){
  .stats-row{grid-template-columns:1fr;gap:10px;}
  .stat-card{padding:14px 12px;}
  .comment-card{padding:14px 12px;}
}
</style>
<link rel="stylesheet" href="/static/student-theme.css">
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleMobileSidebar(false)"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="appSidebar">
  <div class="brand">
    <div class="brand-icon">📚</div>
    <div><h2>EduNote</h2><p>Author Workspace</p></div>
  </div>
  <span class="nav-label">Main Menu</span>
  <ul class="menu">
    <li><a href="/author/{{ user.id }}"><span>🏠</span><span>Dashboard</span></a></li>
    <li><a href="/write-book?author_id={{ user.id }}"><span>✍️</span><span>Write Book</span></a></li>
    <li><a href="/my-books?author_id={{ user.id }}"><span>📚</span><span>My Books</span></a></li>
    <li><a href="/analytics/{{ user.id }}"><span>📊</span><span>Analytics</span></a></li>
    <li class="active"><a href="/comments/{{ user.id }}"><span>💬</span><span>Comments</span></a></li>
    <li><a href="/earnings/{{ user.id }}"><span>💰</span><span>Earnings</span></a></li>
    <li><a href="/profile/{{ user.id }}"><span>👤</span><span>My Profile</span></a></li>
  </ul>
  <div class="sidebar-footer">
    <a href="/logout"><span>🚪</span><span>Logout</span></a>
  </div>
</aside>

<div class="main-content">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileSidebar()" aria-label="Toggle Menu">☰</button>
      <h2 style="font-size:18px;">💬 Reader Comments</h2>
    </div>
    <a href="/author/{{ user.id }}" style="font-size:13px;color:#64748b;text-decoration:none;">← Dashboard</a>
  </div>

  <div class="page">

    <div class="stats-row">
      <div class="stat-card"><h2 id="tc">0</h2><p>Total Comments</p></div>
      <div class="stat-card"><h2 id="tb">0</h2><p>Books Commented On</p></div>
      <div class="stat-card"><h2 id="tr">0</h2><p>Unique Readers</p></div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchComment" placeholder="🔍 Search comments...">
      <select id="filterBook"><option value="">All Books</option></select>
    </div>

    <div class="comment-list" id="commentList">
      <div class="empty-state"><div class="ei">💬</div><h3>Loading comments...</h3></div>
    </div>
  </div>
</div>

<script>
const AUTHOR_ID = Number("{{ user.id }}") || 0;
let allComments = [];

async function loadComments() {
  const res = await fetch(`/author/${AUTHOR_ID}/comments`);
  allComments = await res.json();

  // Stats
  document.getElementById("tc").innerText = allComments.length;
  const uniqueBooks    = new Set(allComments.map(c => c.book_id)).size;
  const uniqueReaders  = new Set(allComments.map(c => c.user_name)).size;
  document.getElementById("tb").innerText = uniqueBooks;
  document.getElementById("tr").innerText = uniqueReaders;

  // Book filter dropdown
  const bookFilter = document.getElementById("filterBook");
  const bookMap = {};
  allComments.forEach(c => { bookMap[c.book_id] = c.book_title; });
  Object.entries(bookMap).forEach(([id, title]) => {
    const opt = document.createElement("option");
    opt.value = id; opt.innerText = title;
    bookFilter.appendChild(opt);
  });

  renderComments(allComments);
}

function renderComments(list) {
  const el = document.getElementById("commentList");
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="ei">💬</div><h3>No comments yet</h3><p>When readers comment on your books, they'll appear here.</p></div>`;
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="comment-card">
      <div class="c-avatar">${c.user_name.charAt(0).toUpperCase()}</div>
      <div class="c-body">
        <h4>${c.user_name}</h4>
        <div class="c-meta">
          <span class="c-book-tag">📖 ${c.book_title}</span>
          <span>🕐 ${c.created_at}</span>
        </div>
        <p class="c-text">${c.text}</p>
      </div>
    </div>
  `).join("");
}

document.getElementById("searchComment").addEventListener("keyup", function() {
  const q = this.value.toLowerCase();
  const bookId = document.getElementById("filterBook").value;
  renderComments(allComments.filter(c =>
    c.text.toLowerCase().includes(q) || c.user_name.toLowerCase().includes(q)
  ).filter(c => !bookId || String(c.book_id) === bookId));
});

document.getElementById("filterBook").addEventListener("change", function() {
  const q = document.getElementById("searchComment").value.toLowerCase();
  renderComments(allComments.filter(c =>
    (!this.value || String(c.book_id) === this.value) &&
    (c.text.toLowerCase().includes(q) || c.user_name.toLowerCase().includes(q))
  ));
});

function toggleMobileSidebar(forced){
  const sidebar = document.getElementById("appSidebar");
  const backdrop = document.getElementById("sidebarBackdrop");
  if(!sidebar) return;
  const shouldOpen = (typeof forced === "boolean") ? forced : !sidebar.classList.contains("open");
  sidebar.classList.toggle("open", shouldOpen);
  if(backdrop){
    backdrop.classList.toggle("active", shouldOpen);
  }
}

// Auto close on navigation
document.querySelectorAll(".sidebar .menu a, .sidebar-footer a").forEach(link => {
  link.addEventListener("click", () => {
    if(window.innerWidth <= 900){
      toggleMobileSidebar(false);
    }
  });
});

loadComments();
</script>
</body>
</html>
